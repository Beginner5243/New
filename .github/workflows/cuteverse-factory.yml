
name: CuteVerse Multi-Length Factory

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: "Video length: 30 to 1800 seconds"
        required: true
        default: "45"
        type: string
      scene_seconds:
        description: "Target duration per scene (3-8 sec)"
        required: true
        default: "5"
        type: string
      aspect:
        description: "Output aspect ratio"
        required: true
        default: "vertical"
        type: choice
        options:
          - vertical
          - horizontal
          - square
      language:
        description: "Narration language"
        required: true
        default: "English"
        type: choice
        options:
          - English
          - Hindi
      mode:
        description: "Production mode"
        required: true
        default: "hybrid"
        type: choice
        options:
          - full_motion
          - hybrid
          - story_mode
      characters:
        description: "Characters, comma separated"
        required: true
        default: "Yeti"
        type: string
      topic:
        description: "Story topic"
        required: true
        default: "A funny friendship adventure"
        type: string
      style:
        description: "Visual style"
        required: true
        default: "Cute high-quality 3D cartoon"
        type: string

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate duration and inputs
        env:
          DURATION: ${{ inputs.duration_seconds }}
          SCENE: ${{ inputs.scene_seconds }}
        run: |
          python - <<'PY'
          import os

          d = int(os.environ["DURATION"])
          s = int(os.environ["SCENE"])

          if not 30 <= d <= 1800:
              raise SystemExit("Duration must be 30-1800 seconds.")

          if not 3 <= s <= 8:
              raise SystemExit("Scene duration must be 3-8 seconds.")

          print("Input validation passed.")
          PY

      - name: Create scene plan
        env:
          DURATION: ${{ inputs.duration_seconds }}
          SCENE_SECONDS: ${{ inputs.scene_seconds }}
          ASPECT: ${{ inputs.aspect }}
          LANGUAGE: ${{ inputs.language }}
          MODE: ${{ inputs.mode }}
          CHARACTERS: ${{ inputs.characters }}
          TOPIC: ${{ inputs.topic }}
          STYLE: ${{ inputs.style }}
          OUTPUT_DIR: output/${{ github.run_id }}
        run: |
          python scripts/plan_video.py \
            --duration "$DURATION" \
            --scene-seconds "$SCENE_SECONDS" \
            --aspect "$ASPECT" \
            --language "$LANGUAGE" \
            --mode "$MODE" \
            --characters "$CHARACTERS" \
            --topic "$TOPIC" \
            --style "$STYLE" \
            --output "$OUTPUT_DIR"

      - name: Generate story, dialogue and narration
        env:
          TOPIC: ${{ inputs.topic }}
          CHARACTERS: ${{ inputs.characters }}
          DURATION: ${{ inputs.duration_seconds }}
          SCENE_SECONDS: ${{ inputs.scene_seconds }}
          LANGUAGE: ${{ inputs.language }}
          STYLE: ${{ inputs.style }}
          OUTPUT_DIR: output/${{ github.run_id }}/story
        run: |
          python scripts/story_engine.py \
            --topic "$TOPIC" \
            --characters "$CHARACTERS" \
            --duration "$DURATION" \
            --scene-seconds "$SCENE_SECONDS" \
            --language "$LANGUAGE" \
            --style "$STYLE" \
            --output "$OUTPUT_DIR"
            
      - name: Install video rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install Pillow

      - name: Build preview MP4
        run: |
          RUN_DIR="output/${{ github.run_id }}"
          STORY_FILE="$(find "$RUN_DIR" -type f -name 'story.json' -print -quit)"

          if [ -z "$STORY_FILE" ]; then
            echo "ERROR: story.json not found in $RUN_DIR"
            find "$RUN_DIR" -maxdepth 4 -type f
            exit 1
          fi

          echo "Story file found: $STORY_FILE"

          python scripts/video_builder.py \
            --story "$STORY_FILE" \
            --output "$RUN_DIR/preview.mp4"

          ls -lh "$RUN_DIR/preview.mp4"
          
      - name: Upload CuteVerse project
        uses: actions/upload-artifact@v4
        with:
          name: cuteverse-project-${{ github.run_id }}
          path: output/${{ github.run_id }}/
          retention-days: 7
          
